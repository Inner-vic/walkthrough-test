# Run explicitly from GitLab Build > Pipelines > Run pipeline.
# Automatic push/MR pipelines remain paused until the runner image source works.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

stages:
  - verify

source-and-input-contracts:
  stage: verify
  image: python:3.11-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUTF8: "1"
  script:
    - python -B -X utf8 tools/check_repository.py
    - python -B -X utf8 tools/run_tests.py --suite portable
